<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oh Norman — Order Confirmation Preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
  <style>
    @font-face {
      font-family: "SharpGroteskBold";
      src: url("https://cdn.shopify.com/s/files/1/0790/2049/1041/files/SharpGroteskBold-25.woff?v=1787683809") format("woff");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "SharpGroteskMedium";
      src: url("https://cdn.shopify.com/s/files/1/0790/2049/1041/files/SharpGroteskMedium-22.woff?v=1787683809") format("woff");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: "SharpSans-Book";
      src: url("https://cdn.shopify.com/s/files/1/0790/2049/1041/files/SharpSans-Book.woff?v=1787683809") format("woff");
      font-weight: 400;
      font-style: normal;
    }
    body { margin: 0; padding: 32px 16px; background: #e8e8e8; font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; line-height: 1.4 !important; }
    .preview-label { max-width: 600px; margin: 0 auto 8px; font-size: 13px; color: #666; text-align: center; }
    .preview-note { max-width: 600px; margin: 0 auto 16px; font-size: 12px; color: #888; text-align: center; line-height: 1.4; }
    .preview-note.error { color: #960000; }
    .email-wrapper { max-width: 600px; margin: 0 auto; background: #F3EDE1; box-shadow: 0 4px 24px rgba(0,0,0,0.12); font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; }
    .container { max-width: 520px; margin: 0; }
    .content__cell { padding: 48px 40px; background: #F3EDE1; font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; line-height: 1.4 !important; text-align: left !important; }
    .section__cell { padding: 40px 40px; background: #F3EDE1; font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; line-height: 1.4 !important; text-align: left !important; }
    h3, h4 { font-family: "SharpGroteskBold", "Open Sans", Arial, sans-serif !important; font-weight: 700 !important; color: #960000 !important; text-align: left !important; line-height: 1.4 !important; }
    h3 { font-size: 18px; margin: 0 0 16px; }
    h4 { font-size: 14px; margin: 0 0 8px; }
    .on-heading { font-family: "SharpGroteskBold", "Open Sans", Arial, sans-serif !important; font-weight: 700 !important; color: #960000 !important; text-align: left !important; margin: 0 0 20px; font-size: 32px; line-height: 1.4 !important; }
    .on-body { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; color: #960000 !important; text-align: left !important; line-height: 1.4 !important; font-size: 15px; margin: 0 0 28px; }
    .on-order-number { font-family: "SharpGroteskMedium", "Open Sans", Arial, sans-serif !important; font-size: 17px; font-weight: 500 !important; color: #960000 !important; text-align: left !important; margin: 24px 0 0; line-height: 1.4 !important; }
    .on-section-headline { font-family: "SharpGroteskBold", "Open Sans", Arial, sans-serif !important; font-weight: 700 !important; color: #960000 !important; text-align: left !important; line-height: 1.4 !important; font-size: 25px; margin: 0 0 16px; }
    .button__cell, .actions-buttons .button__cell { background: #960000 !important; padding: 14px 20px; text-align: center; }
    .button__text,
    .button__text:hover,
    .button__text:active,
    .button__text:visited { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; color: #F3EDE1 !important; text-decoration: none !important; font-size: 13px; font-weight: 600; line-height: 1.4 !important; }
    a.button__text, a.button__text:link, a.button__text:visited, a.button__text:hover, a.button__text:active { color: #F3EDE1 !important; }
    .button__cell--shop-app, .actions-buttons .button__cell--shop-app { background: #333333 !important; }
    .actions-buttons { width: 100%; margin: 0; border-collapse: collapse; border-spacing: 0; }
    .on-made-for-pets-body { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; color: #960000 !important; text-align: left !important; font-size: 15px; line-height: 1.4 !important; margin: 0; }
    .on-footer-text { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; color: #F3EDE1 !important; font-size: 12px; text-align: center !important; margin: 0; line-height: 1.4 !important; }
    .on-footer, .on-footer td, .on-footer table, .on-footer a, .on-footer img { border: none !important; outline: none !important; box-shadow: none !important; background-color: #960000 !important; }
    .on-nav-link { font-family: "SharpGroteskMedium", "Open Sans", Arial, sans-serif !important; color: #F3EDE1 !important; text-decoration: underline !important; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500 !important; line-height: 1.4 !important; }
    a, a:link, a:visited, a:hover, a:active { color: #960000 !important; }
    .on-nav a, .on-nav a:link, .on-nav a:visited, .on-footer a, .on-footer a:link, .on-footer a:visited { color: #F3EDE1 !important; }
    .line-item { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; font-size: 14px; color: #960000 !important; margin: 0 0 12px; line-height: 1.4 !important; text-align: left !important; }
    .line-item img { vertical-align: middle; margin-right: 10px; border-radius: 4px; }
    .summary-row { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; font-size: 14px; color: #960000 !important; margin: 4px 0; text-align: left !important; line-height: 1.4 !important; }
    .summary-total { font-family: "SharpGroteskBold", "Open Sans", Arial, sans-serif !important; font-size: 16px; color: #960000 !important; text-align: left !important; margin-top: 12px; font-weight: 700 !important; line-height: 1.4 !important; }
    .customer-info { font-family: "SharpSans-Book", "Open Sans", Arial, sans-serif !important; font-size: 14px; color: #960000 !important; line-height: 1.4 !important; white-space: pre-line; text-align: left !important; }
    .customer-columns { width: 100%; border-collapse: collapse; }
    .customer-columns td { vertical-align: top; width: 50%; padding-right: 12px; text-align: left !important; }
  </style>
</head>
<body>
  <p class="preview-label" id="preview-label">Oh Norman order confirmation preview</p>
  <p class="preview-note" id="preview-note">Loading Shopify order data…</p>
  <div class="email-wrapper" id="email-root"></div>

  <script>
    const UTM = 'utm_source=shopify_email&utm_medium=email&utm_campaign=order_confirmation';
    const onUrl = (url, content) => `${url}${url.includes('?') ? '&' : '?'}${UTM}&utm_content=${content}`;
    const FONT_HEADLINE = '"SharpGroteskBold", "Open Sans", Arial, sans-serif';
    const FONT_SUBHEAD = '"SharpGroteskMedium", "Open Sans", Arial, sans-serif';
    const FONT_BODY = '"SharpSans-Book", "Open Sans", Arial, sans-serif';
    const CREAM_TEXT = '#F3EDE1';
    const MASCOT_URL = 'assets/oh-norman-mascot-cream-peeking.png';

    const LINKS = {
      contact: onUrl('https://ohnorman.com/pages/contact', 'contact'),
      faqs: onUrl('https://ohnorman.com/pages/faqs-1', 'faqs'),
      rescue: onUrl('https://ohnorman.com/pages/about-us-1', 'gives_back'),
      dog: onUrl('https://ohnorman.com/collections/our-dog-products', 'dog'),
      cat: onUrl('https://ohnorman.com/collections/our-cat-products', 'cat'),
      gift: onUrl('https://ohnorman.com/collections/gift-cards', 'gift_card'),
      privacy: onUrl('https://ohnorman.com/policies/privacy-policy', 'privacy'),
      terms: onUrl('https://ohnorman.com/policies/terms-of-service', 'terms'),
      instagram: onUrl('https://www.instagram.com/ohnorman/', 'instagram'),
      tiktok: onUrl('https://www.tiktok.com/@oh_norman_', 'tiktok'),
      facebook: onUrl('https://www.facebook.com/ohnorman/', 'facebook')
    };

    const FALLBACK = {
      orderNumber: '87897',
      firstName: 'Customer',
      currency: 'USD',
      lineItems: [],
      total: null
    };

    function money(amount, currency) {
      if (amount == null || amount === '') return '—';
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: currency || 'USD'
      }).format(Number(amount));
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function render(order) {
      const itemsHtml = order.lineItems.length
        ? order.lineItems.map((item) => {
            const title = item.variant && item.variant !== 'Default Title'
              ? `${item.title} — ${item.variant}`
              : item.title;
            const img = item.image
              ? `<img src="${escapeHtml(item.image)}" alt="" width="60" height="60">`
              : '';
            return `<p class="line-item">${img}${escapeHtml(title)} × ${item.quantity} — <strong>${money(item.lineTotal, order.currency)}</strong></p>`;
          }).join('')
        : '<p class="line-item" style="color:#888;font-style:italic;">No line items loaded. Run <code>ruby scripts/fetch-order-preview.rb 87897</code> after setting up .env</p>';

      const summaryRows = [
        order.subtotal != null ? `<p class="summary-row">Subtotal: ${money(order.subtotal, order.currency)}</p>` : '',
        order.shipping != null && Number(order.shipping) > 0 ? `<p class="summary-row">Shipping: ${money(order.shipping, order.currency)}</p>` : '',
        order.tax != null && Number(order.tax) > 0 ? `<p class="summary-row">Tax: ${money(order.tax, order.currency)}</p>` : '',
        order.total != null ? `<p class="summary-total">Total: ${money(order.total, order.currency)} ${order.currency}</p>` : ''
      ].join('');

      const customerHtml = (order.shippingAddress || order.billingAddress)
        ? `<table class="customer-columns"><tr>
            ${order.shippingAddress ? `<td><h4>Shipping address</h4><div class="customer-info">${escapeHtml(order.shippingAddress)}</div></td>` : ''}
            ${order.billingAddress ? `<td><h4>Billing address</h4><div class="customer-info">${escapeHtml(order.billingAddress)}</div></td>` : ''}
          </tr></table>`
        : '<p class="customer-info" style="color:#888;">Customer addresses will appear after fetching order data.</p>';

      document.getElementById('preview-label').textContent = `Order confirmation preview — Order #${order.orderNumber}`;
      document.getElementById('preview-note').textContent = order.fetchedAt
        ? `Live Shopify data fetched ${new Date(order.fetchedAt).toLocaleString()}`
        : 'Sample preview — fetch Shopify data to populate';

      document.getElementById('email-root').innerHTML = `
        <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <table width="100%"><tr><td style="background:#960000;padding:28px 40px;text-align:left;">
            <img src="https://cdn.shopify.com/s/files/1/0790/2049/1041/files/Layer_1-2.png" alt="Oh Norman!" width="200" style="max-width:200px;display:block;margin:0;border:0;">
          </td></tr></table>
          <table width="100%"><tr><td class="content__cell"><div class="container">
            <h2 class="on-heading" style="font-family:${FONT_HEADLINE} !important;font-weight:700 !important;color:#960000 !important;text-align:left !important;line-height:1.4 !important;font-size:32px;margin:0 0 20px;">Thank you for your order, ${escapeHtml(order.firstName)}!</h2>
            <p class="on-body" style="font-family:${FONT_BODY} !important;color:#960000 !important;text-align:left !important;line-height:1.4 !important;font-size:15px;margin:0 0 28px;">Your order is being prepared. We'll send you another email as soon as it's on the way.</p>
            <table class="actions-buttons" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
              <td class="button__cell" style="background-color:#960000 !important;padding:14px 20px;text-align:center;"><a href="#" class="button__text" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;line-height:1.4 !important;text-decoration:none !important;display:block;width:100%;"><span style="color:${CREAM_TEXT} !important;">View your order</span></a></td>
            </tr><tr><td style="height:8px;font-size:0;line-height:0;">&nbsp;</td></tr><tr>
              <td class="button__cell button__cell--shop-app" style="background-color:#333333 !important;padding:14px 20px;text-align:center;"><a href="#" class="button__text" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;line-height:1.4 !important;text-decoration:none !important;display:block;width:100%;"><span style="color:${CREAM_TEXT} !important;">Track order with Shop</span></a></td>
            </tr></table>
            <p class="on-order-number" style="font-family:${FONT_SUBHEAD} !important;font-weight:500 !important;color:#960000 !important;text-align:left !important;line-height:1.4 !important;margin:24px 0 0;">Order #${escapeHtml(order.orderNumber)}</p>
          </div></td></tr></table>
          <table width="100%"><tr><td class="section__cell"><div class="container">
            <h3>Order summary</h3>
            ${itemsHtml}
            ${summaryRows}
          </div></td></tr></table>
          <table width="100%"><tr><td class="section__cell"><div class="container">
            <h3>Customer information</h3>
            ${customerHtml}
          </div></td></tr></table>
          <table width="100%"><tr><td style="background:#F3EDE1;padding:40px 40px 48px;text-align:left !important;">
            <h3 class="on-section-headline" style="font-family:${FONT_HEADLINE} !important;font-weight:700 !important;color:#960000 !important;text-align:left !important;line-height:1.4 !important;font-size:25px;margin:0 0 16px;">Have questions?</h3>
            <p style="font-family:${FONT_BODY} !important;color:#960000;font-size:15px;line-height:1.4 !important;margin:0;text-align:left !important;">We're here to help. <a href="${LINKS.contact}" style="font-family:${FONT_BODY} !important;color:#960000 !important;text-decoration:underline !important;"><span style="color:#960000 !important;text-decoration:underline !important;">Contact us</span></a> or check out our <a href="${LINKS.faqs}" style="font-family:${FONT_BODY} !important;color:#960000 !important;text-decoration:underline !important;"><span style="color:#960000 !important;text-decoration:underline !important;">FAQs</span></a>.</p>
          </td></tr></table>
          <table width="100%"><tr><td style="background:#FFB000;padding:40px 40px 48px;text-align:left !important;">
            <h3 class="on-section-headline" style="font-family:${FONT_HEADLINE} !important;font-weight:700 !important;color:#960000 !important;text-align:left !important;line-height:1.4 !important;font-size:25px;margin:0 0 16px;">Made For Pets And The People Who Effing Love Them.</h3>
            <p class="on-made-for-pets-body" style="font-family:${FONT_BODY} !important;color:#960000;text-align:left !important;line-height:1.4 !important;margin:0;">All-natural supplements, treats & care products in partnership with Board-Certified Veterinary Specialists. Plus, every purchase <a href="${LINKS.rescue}" style="font-family:${FONT_BODY} !important;color:#960000 !important;text-decoration:underline !important;"><span style="color:#960000 !important;text-decoration:underline !important;">gives back to rescues</span></a>.</p>
          </td></tr></table>
          <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="background:#960000;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td align="center" style="padding:20px 24px;border-bottom:1px solid #F3EDE1;"><a href="${LINKS.dog}" class="on-nav-link" style="font-family:${FONT_SUBHEAD} !important;font-weight:500 !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Dog</span></a></td></tr>
              <tr><td align="center" style="padding:20px 24px;border-bottom:1px solid #F3EDE1;"><a href="${LINKS.cat}" class="on-nav-link" style="font-family:${FONT_SUBHEAD} !important;font-weight:500 !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Cat</span></a></td></tr>
              <tr><td align="center" style="padding:20px 24px;border-bottom:1px solid #F3EDE1;"><a href="${LINKS.gift}" class="on-nav-link" style="font-family:${FONT_SUBHEAD} !important;font-weight:500 !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Gift Card</span></a></td></tr>
            </table>
          </td></tr></table>
          <table class="on-footer" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
            <td style="background:#960000 !important;padding:28px 20px 0;text-align:center;border:none;outline:none;overflow:hidden;">
              <table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 20px;">
                <tr>
                  <td style="padding:0 10px;background:#960000 !important;"><a href="${LINKS.facebook}" style="border:0;outline:none;text-decoration:none;"><img src="https://cdn.shopify.com/s/files/1/0790/2049/1041/files/FFB100.png?v=1787678882" alt="Facebook" width="36" height="36" style="display:block;border:0;outline:none;"></a></td>
                  <td style="padding:0 10px;background:#960000 !important;"><a href="${LINKS.tiktok}" style="border:0;outline:none;text-decoration:none;"><img src="https://cdn.shopify.com/s/files/1/0790/2049/1041/files/tiktok-yellow.png" alt="TikTok" width="36" height="36" style="display:block;border:0;outline:none;"></a></td>
                  <td style="padding:0 10px;background:#960000 !important;"><a href="${LINKS.instagram}" style="border:0;outline:none;text-decoration:none;"><img src="https://cdn.shopify.com/s/files/1/0790/2049/1041/files/FFB100_2.png?v=1787678881" alt="Instagram" width="36" height="36" style="display:block;border:0;outline:none;"></a></td>
                </tr>
              </table>
              <p class="on-footer-text" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;line-height:1.4 !important;text-align:center !important;">&copy; ${new Date().getFullYear()} Oh Norman!</p>
              <p class="on-footer-text" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;font-size:11px;line-height:1.4 !important;margin:16px 0 24px;text-align:center !important;">
                <a href="${LINKS.contact}" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;border:0;outline:none;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Contact Us</span></a> |
                <a href="${LINKS.faqs}" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;border:0;outline:none;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">FAQs</span></a> |
                <a href="${LINKS.terms}" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;border:0;outline:none;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Terms of Service</span></a> |
                <a href="${LINKS.privacy}" style="font-family:${FONT_BODY} !important;color:${CREAM_TEXT} !important;text-decoration:underline !important;border:0;outline:none;"><span style="color:${CREAM_TEXT} !important;text-decoration:underline !important;">Privacy Policy</span></a>
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="55%" style="font-size:0;line-height:0;">&nbsp;</td>
                  <td align="right" valign="bottom" width="45%" style="font-size:0;line-height:0;padding:0;">
                    <img src="${MASCOT_URL}" alt="" width="260" style="display:block;width:260px;max-width:260px;height:auto;border:0;outline:none;margin:0 -36px -72px 0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr></table>
        </td></tr></table>`;
    }

    fetch('order-preview-data.json?' + Date.now())
      .then((res) => {
        if (!res.ok) throw new Error('No order-preview-data.json yet');
        return res.json();
      })
      .then((data) => render(data))
      .catch(() => {
        document.getElementById('preview-note').className = 'preview-note error';
        document.getElementById('preview-note').innerHTML = 'No Shopify data yet. Follow <strong>PREVIEW-SETUP.md</strong> to create a read-only app token, then run <code>ruby scripts/fetch-order-preview.rb 87897</code>.';
        render(FALLBACK);
      });
  </script>
</body>
</html>
